# Phase 4A: does advantage *magnitude* cause unstable updates?
# Return-std reward scaling is OFF so the multiplier actually reaches the advantages.
# 2 x 3 x 5 seeds = 30 runs.
name: adv_scale
base:
  env_id: Hopper-v5
  total_steps: 1000000
  scale_reward: false
grid:
  norm_adv: [true, false]
  reward_multiplier: [0.1, 1.0, 10.0]
  seed: [0, 1, 2, 3, 4]
